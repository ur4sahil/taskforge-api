# Runs the full Jest suite (unit + integration) against throwaway Postgres and
# Redis containers on every push and PR. The integration specs expect the same
# ports the local Docker containers use (5433 / 6380), see test/global-setup.ts
# and test/setup-env.ts. Throttling is skipped under NODE_ENV=test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskforge_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:test@localhost:5433/taskforge_test
      DIRECT_URL: postgresql://postgres:test@localhost:5433/taskforge_test
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Type-check (src + tests)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Jest
        run: npx jest --forceExit --ci
